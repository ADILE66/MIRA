<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="miraBadgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021C42" />
      <stop offset="100%" stop-color="#07306D" />
    </linearGradient>
    <filter id="miraSubtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle / Rounded Badge Background -->
  <rect x="3" y="3" width="94" height="94" rx="22" fill="url(#miraBadgeGradient)" stroke="#1D4ED8" stroke-width="1.2" filter="url(#miraSubtleShadow)" />

  <!-- Flight Takeoff Icon (Centered Vector) -->
  <g transform="translate(13, 11) scale(3.1)">
    <!-- Runway Line with rounded caps -->
    <rect x="2.5" y="19" width="19" height="2.2" rx="1.1" fill="#FFFFFF" />

    <!-- Airplane Taking Off -->
    <path
      d="M22.07 9.64c-.39-.8-1.35-1.12-2.15-.73L13.2 12.18 5.5 5.99l-1.95.95 5.22 7.34-5.14 2.52-1.92-.42-1.42.69 3.02 2.83 3.29 1.6 15.11-7.35c.9-.44 1.22-1.4.83-2.2l-.38-1.36z"
      fill="#FFFFFF"
    />
  </g>
</svg>
